{% extends "base.html" %}
{% block content %}
  <div class="card narrow">
    <h1>Log in to {{ site.name }}</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <form method="post" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="current-password">Password</label>
      <input id="current-password" name="current-password" type="password"
             autocomplete="current-password" required>

      <button type="submit" class="button">Log in</button>
    </form>

    <p class="hint">
      If you saved a password here before, Chrome should have offered to
      autofill this form as soon as you clicked into the email field.
    </p>
    <p class="muted">No account yet? <a href="{{ url_for('signup') }}">Sign up</a></p>
  </div>
{% endblock %}
