<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>:root { --accent: {{ site.accent }}; }</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">{{ site.name }}</a>
    <nav>
      {% if logged_in_email %}
        <span class="muted">{{ logged_in_email }}</span>
        <a href="{{ url_for('change_password') }}">Change password</a>
        <a href="{{ url_for('logout') }}">Log out</a>
      {% else %}
        <a href="{{ url_for('login') }}">Log in</a>
        <a class="button" href="{{ url_for('signup') }}">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>{{ site.tagline }} &middot; part of the Google Password Manager practice demo.</p>
  </footer>
</body>
</html>
